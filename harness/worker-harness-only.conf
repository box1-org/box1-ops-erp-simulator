# HARNESS ONLY: never install in the VM.
# Rootless Podman runs the container's PID 1 under its own seccomp filter without
# CAP_SYS_ADMIN, so systemd cannot add seccomp-based sandboxing to a service that
# switches user (status 217/USER). Each directive below failed alone in a probe
# unit. The shipped unit keeps them all; #25 verifies them in the VM.
[Service]
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectHostname=no
RestrictAddressFamilies=
RestrictNamespaces=no
RestrictRealtime=no
RestrictSUIDSGID=no
LockPersonality=no
SystemCallArchitectures=
SystemCallFilter=
ProtectProc=default
ProcSubset=all
# Shorter watchdog so the harness can show a hung worker being restarted.
WatchdogSec=10
