# Install as /usr/lib/tmpfiles.d/box1-erp.conf. Applies after the data volume is mounted.
# Ledger and spool: application user only. The SFTP account has no access.
d /var/lib/box1-erp                    0750 box1erp box1erp -
d /var/lib/box1-erp/spool              0750 box1erp box1erp -
d /var/lib/box1-erp/spool/archive      0750 box1erp box1erp -
d /var/lib/box1-erp/spool/quarantine   0750 box1erp box1erp -
d /var/lib/box1-erp/backups            0750 box1erp box1erp -
# SFTP chroot: the chroot root must be root-owned and not group-writable (sshd rule).
d /srv/box1-erp                        0755 root    root    -
d /srv/box1-erp/exchange               0755 root    root    -
d /srv/box1-erp/exchange/inbound       2770 root    erpxfer -
d /srv/box1-erp/exchange/outbound      2770 root    erpxfer -
d /srv/box1-erp/exchange/consumed      2770 root    erpxfer -
