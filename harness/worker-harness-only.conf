# HARNESS ONLY: never install in the VM.
# Rootless Podman runs the container's PID 1 under its own seccomp filter without
# CAP_SYS_ADMIN, so systemd cannot add the seccomp-based sandboxing below to a
# service that switches user (status 217/USER). Each of these twelve failed alone
# in a probe unit. The shipped unit keeps them; #25 verifies them in the VM.
[Service]
PrivateDevices=no
ProtectKernelTunables=no
ProtectKernelModules=no
ProtectKernelLogs=no
ProtectClock=no
ProtectHostname=no
RestrictAddressFamilies=
RestrictNamespaces=no
RestrictRealtime=no
RestrictSUIDSGID=no
LockPersonality=no
SystemCallArchitectures=
