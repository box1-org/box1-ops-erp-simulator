# Release on push to main: run the shared legacy-erp-appliance Pipeline, defined
# once in box1-org/legacy-erp (.tekton/appliance-pipeline.yaml, box1-docs#25), with
# this commit and legacy-erp main. It tests this repository (ruff, pytest against
# the pinned contracts), builds the legacy-erp RHEL image mode OS image with this
# source, scans it, promotes it through box1-workloads-dev, and applies it in the
# running VM with `bootc upgrade --apply`, verifying the booted digest and units.
# legacy-erp pushes run the same Pipeline with the roles swapped.
# The earlier one-layer bundle image (scripts/make-oci-layout.py) is no longer
# produced; the appliance builds from source.
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: box1-ops-erp-simulator-release-
  labels:
    backstage.io/kubernetes-id: box1-ops-erp-simulator
  annotations:
    pipelinesascode.tekton.dev/on-event: "[push]"
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/target-namespace: box1-ci
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/pipeline: "https://raw.githubusercontent.com/box1-org/legacy-erp/main/.tekton/appliance-pipeline.yaml"
spec:
  pipelineRef:
    name: legacy-erp-appliance
  taskRunTemplate:
    serviceAccountName: ci-bootc-release
  timeouts:
    pipeline: 120m
  params:
    - name: os-revision
      value: main
    - name: erp-revision
      value: "{{revision}}"
    - name: git-auth-secret
      value: "{{git_auth_secret}}"
    - name: security-gates
      value: observe
  taskRunSpecs:
    - pipelineTaskName: resolve
      serviceAccountName: ci-test
    - pipelineTaskName: erp-test
      serviceAccountName: ci-test
    - pipelineTaskName: current
      serviceAccountName: ci-test
    - pipelineTaskName: security
      serviceAccountName: ci-build
    - pipelineTaskName: promote
      serviceAccountName: ci-gitops
    - pipelineTaskName: deploy
      serviceAccountName: ci-vm-deploy
    - pipelineTaskName: smoke
      serviceAccountName: ci-observe
