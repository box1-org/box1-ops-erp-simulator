# Install as /usr/lib/sysusers.d/box1-erp.conf
# Fixed IDs: a rebuilt guest must own the files on the kept data volume.
g erpxfer  961
u box1erp  962      "box1 ERP application"              /srv/box1-erp/state     /usr/sbin/nologin
m box1erp  erpxfer
u erpsftp  963      "box1 ERP SFTP exchange (adapter)"   /srv/box1-erp/exchange  /usr/sbin/nologin
m erpsftp  erpxfer
